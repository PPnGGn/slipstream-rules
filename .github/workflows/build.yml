name: build geo

on:
  schedule:
    # Weekly (Mon 03:17 UTC). RunetFreedom refreshes every 6h, but for routing a
    # weekly rebuild is plenty; the app only re-downloads on a button press or a
    # fresh install. Publish is skipped anyway when the trimmed output is byte-
    # identical to the current release.
    - cron: "17 3 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "categories/**"
      - "cmd/**"
      - "go.*"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  issues: write # only used by the "Report failure" step

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"

      - name: Check
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt needs to run on:"; gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go build -o bin/geofilter ./cmd/geofilter
          go build -o bin/geocheck  ./cmd/geocheck

      - name: Fetch upstream geo data
        run: |
          mkdir -p raw dist
          base=https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download
          curl -fsSL -o raw/geosite.dat "$base/geosite.dat"
          curl -fsSL -o raw/geoip.dat   "$base/geoip.dat"
          ls -la raw

      - name: Trim
        run: |
          ./bin/geofilter -kind geosite \
            -allow categories/geosite.txt -in raw/geosite.dat -out dist/geosite.dat > dist/site.json
          ./bin/geofilter -kind geoip \
            -allow categories/geoip.txt   -in raw/geoip.dat   -out dist/geoip.dat   > dist/ip.json

      - name: Assemble categories.json + checksums
        run: |
          jq -n --slurpfile s dist/site.json --slurpfile i dist/ip.json \
            '{site: $s[0], ip: $i[0]}' > dist/categories.json
          rm dist/site.json dist/ip.json
          cd dist && sha256sum geosite.dat geoip.dat categories.json > sha256sums.txt
          cat categories.json
          echo "---"
          cat sha256sums.txt

      - name: Verify the trimmed .dat loads in xray-core
        run: ./bin/geocheck -dir dist

      - name: Skip publish if identical to the latest release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          if gh release download --pattern sha256sums.txt --dir prev 2>/dev/null \
             && diff -q prev/sha256sums.txt dist/sha256sums.txt >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change from the latest release — nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.gate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Trimmed from runetfreedom/russia-v2ray-rules-dat (GPL-3.0). Categories in categories.json." \
            dist/geosite.dat dist/geoip.dat dist/categories.json dist/sha256sums.txt

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="build geo failed"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $run_url"
          else
            gh issue create --title "$title" \
              --body "The scheduled geo build failed. Latest release is still served as-is. Run: $run_url"
          fi
